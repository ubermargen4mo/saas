name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Android SDK platform 37.1
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.1" "build-tools;36.0.0" || true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hrips.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/hrips.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет KEYSTORE_BASE64 не задан: сборка будет подписана временным ключом"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: APK size breakdown
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          ls -l "$APK"
          unzip -lv "$APK" | sort -k3 -nr | head -25

      - uses: actions/upload-artifact@v4
        with:
          name: hrips-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "hrips-$VER.apk"
          awk '/^## /{n++} n==1' CHANGES.md > notes.md || echo "Сборка $VER" > notes.md
          gh release create "build-${{ github.run_number }}" "hrips-$VER.apk" --title "hrips $VER" --notes-file notes.md --latest

      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

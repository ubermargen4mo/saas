name: Build APK

# Сборка запускается только вручную: Actions → Build APK → Run workflow.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз (если выключить, APK будет только во вложениях запуска)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Android SDK platform 37.2
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.2" "build-tools;36.0.0" || true

      - name: Fetch uBlock Origin
        env:
          UBO_VERSION: 1.75.0
        run: |
          curl -fsSL -o ubo.xpi "https://github.com/gorhill/uBlock/releases/download/${UBO_VERSION}/uBlock0_${UBO_VERSION}.firefox.signed.xpi"
          mkdir -p app/src/main/assets/ublock
          unzip -q -o ubo.xpi -d app/src/main/assets/ublock
          rm -rf app/src/main/assets/ublock/META-INF
          find app/src/main/assets/ublock/_locales -mindepth 1 -maxdepth 1 ! -name en ! -name ru -exec rm -rf {} +

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hrips.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/hrips.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет KEYSTORE_BASE64 не задан: сборка будет подписана временным ключом"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: hrips-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          VER="1.$((N / 100)).$((N % 100))"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "hrips-$VER.apk"
          awk '/^## /{n++} n==1' CHANGES.md > notes.md || echo "Сборка $VER" > notes.md
          gh release create "build-${{ github.run_number }}" "hrips-$VER.apk" --title "hrips $VER" --notes-file notes.md --latest
